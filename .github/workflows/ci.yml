name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Rapide : typecheck + build + tests unitaires et fonctionnels, à chaque push/PR.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Lent/coûteux : E2E Obsidian réel (télécharge Obsidian, headless via xvfb).
  # Seulement sur main ou déclenchement manuel — pas sur chaque push (cf. PLAN.md).
  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tests E2E (Obsidian headless)
        run: xvfb-run --auto-servernum npm run test:e2e
